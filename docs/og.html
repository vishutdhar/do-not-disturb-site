<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Do Not Disturb social card</title>
    <!-- The card reuses the site's font and tokens: the ground, the h1 and the door hanger mark.
         scripts/og.mjs renders it to assets/og-<date>.png at 1200 by 630. -->
    <link rel="stylesheet" href="../styles.css">
    <style>
        html, body { margin: 0; }
        body { width: 1200px; height: 630px; overflow: hidden; }
        .og {
            position: relative;
            width: 1200px;
            height: 630px;
            padding: 84px 96px;
        }
        .og-brand { display: flex; align-items: center; gap: 18px; color: var(--ink); font-size: 34px; font-weight: 900; letter-spacing: -0.01em; }
        .og-brand img { width: 32px; height: 47px; }
        .og h1 { margin-top: 72px; max-width: 8em; font-size: 100px; font-weight: 900; line-height: 1.02; letter-spacing: -0.03em; }
        .og-mark { position: absolute; right: 120px; top: 150px; width: 220px; height: auto; }
    </style>
</head>
<body>
    <div class="og">
        <div class="og-brand"><img src="../assets/hanger.svg" alt="">Do Not Disturb</div>
        <h1>No judgement.<br>Just receipts.</h1>
        <img class="og-mark" src="../assets/hanger.svg" alt="">
    </div>
</body>
</html>
